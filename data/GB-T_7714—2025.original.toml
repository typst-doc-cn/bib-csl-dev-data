notes = '''
此文件记录国标示例原文。
由于数据质量较差，仓库 README 特意未介绍。请谨慎参考。

此文件以 Z-Library 以下 PDF 中嵌入的文本为准。Z-Library 该页面称：「（此 PDF）购买自中国标网，然后自行编辑PDF，添加了书签和逻辑页码。」
https://z-lib.sk/book/Eq8yZgnY5D/gbt-77142025-信息与文献-参考文献著录规则.html

## 数据质量差的具体表现

数据质量差主要是 PDF 嵌入的文本与显示的文本并不完全一致。
「嵌入的文本」是指 PDF /ToUnicode 中存储的文本，即选中复制出来的文本。它与字体实际字形、周围间距大小的关系不完全确定。
比如冒号在该 PDF 示例中明显占一个汉字宽度，但嵌入的文本却是 U+003A COLON `:`，并非更常见的 U+FF1A FULLWIDTH COLON `：`。另外地图比例尺中还有形态相近的冒号，这些则嵌入了 U+2236 Mathematical Operators RATIO `∶`。
再比如嵌入空格与显示空隙并没有必然关系。文字紧密相邻处可能嵌入了空格，而文字明显空开处可能又没嵌入空格。此文件抄录时适当补充了一些空格，具体规则见后。
总体来说，显示的文本更正常，但辨识它有很大主观成分，所以此文件只好选择择嵌入的文本。

其实国标自身也有些情况。
排版方面，长 URL 只能这成多行著录，但国标有时会在折行处添加连字符`-`。然而 URL 本身就可能包含`-`，所以行末的`-`说不清是 URL 原本就包含，还是断行时所添加。此文件适当灵活处理了，具体规则见后。
实质性内容方面，有些著录示例出现于多个章节，但前后不完全一致。例如§8.15.2示例[3]与附录B.14示例[4]著录同一预印本，但前者标注 V2，后者标注 V2.arXiv。更多类似情况可参考`scripts/check_consistency.py`中的`check_original_consistency`。

此外，§7著录通则的例子大多是片段，不适合集成测试。

## 抄录细节

### 空格补充规则

原文很多外文人名、题名各单词间有空隙，但大部分从 PDF 复制不出空格。因此按以下规则补充了一些空格。（「□与□之间」都对称考虑；字母包括URL中的字母）

- 从 PDF 复制后，补充空格：
  - 汉字与汉字之间，字母与字母、数字之间，数字与数字之间
  - 前后均为单词的断行处
  - 顺序编码制编号与内容之间

- 不补充空格，保持 PDF 复制结果原貌：
  - 汉字与字母、数字、符号之间，字母与符号之间，数字与符号，符号与符号之间（顺序编码制编号与内容之间除外）
  - 前方有连字符的断行处
  - 所有其它情况

若补充空格，无论原文空隙多宽，一律补充单个 U+0020 SPACE 字符。

### 连字符消除规则

通常删除连字符，但明显为页码或年月日的连接号的除外，其它个别特殊情况注于 notes。
'''

